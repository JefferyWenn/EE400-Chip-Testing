# Main hammer config file

# Set top levels
synthesis.inputs.top_module: "chip_top"
sim.inputs.tb_name: "chip_top_tb"

# DUT hierarchy path — enables the gate-sim CDC noTiming block (generate_sim_cmd.py)
# that disables SDF timing checks on async-input synchronizers (bsg_SYNC_1_r_reg,
# firmware_loader rx_sync_reg). Sim-only; no effect on syn/par/signoff.
sim.inputs.dut_path: "chip_top_tb.uut"

# Disable clock gating. reset_cnt (the bsg-link reset sequencer in chip_top.sv)
# sits in the bootstrap reset path and uses a synchronous reset; if Genus gates
# its clock, the gate is closed during reset -> reset_cnt=X -> nRESET=X -> no boot
# at gate level. With gating off, every sync-reset flop initializes from a live
# clock. (Removing ICGs also simplifies CTS/DFT/timing; cost is dynamic power.)
synthesis.clock_gating_mode: "empty"

# Don't synthesize these gate-level netlist modules
synthesis.inputs.preserve_modules: ["pad_ring_64"]
synthesis.genus.write_sdf_args: ["-timescale ns"]

# Custom SDC constraints
vlsi.inputs:
  # You can add SDC constraints directly here (list of strings)
  custom_sdc_constraints: []
  
  # Additional SDC files to read
  custom_sdc_files:
    - "constraints.tcl"
  custom_sdc_files_meta: prependlocal # Prepend path of this config file!

  # Optional second constraint mode for DFT scan-shift timing analysis.
  # When provided, Genus/Innovus/Tempus create a `scan_constraint_mode` from
  # these SDCs and pair every functional analysis view with a `_scan_view`
  # using the same delay corner. Both modes are activated together in
  # set_analysis_view, so Innovus's opt_design hold-fix considers scan-shift
  # paths (the previous flow only checked them via a bolt-on Tempus Makefile
  # target and PAR never fixed scan-mode hold violations).
  scan_sdc_files:
    - "scan_mode.sdc"
  scan_sdc_files_meta: prependlocal

vlsi.inputs.decaps:
  - target: "capacitance"
    capacitance: "1600" 
    x: 0 
    y: 0 
    width: 1620
    height: 1730
    

# Placement Constraints
vlsi.inputs.placement_constraints:
  - path: "TOP" # (this name isn't actually checked...)
    type: toplevel
    # define chip dimensions
    width:  1620
    height: 1730
    x: 0
    y: 0
    margins: {left: 0, right: 0, top: 0, bottom: 0}

par.innovus.floorplan_mode: "manual"
par.innovus.floorplan_script_contents: "source ../../cfg/pad.tcl"
# par.innovus.floorplan_script_contents: "source ../../cfg/pad.tcl; source ../../cfg/floorplan.tcl"

vlsi.inputs.pin_mode: "generated"
vlsi.inputs.pin.generate_mode: "semi_auto" # Prepend path of this config file!
vlsi.inputs.pin.assignments: 
    - pins: "*"
      preplaced: true

par.power_straps_mode: "manual"
par.power_straps_script_contents: "source ../../cfg/power_straps.tcl"

vlsi.inputs.power_spec_mode: "manual"
vlsi.inputs.power_spec_type: "cpf"
vlsi.inputs.power_spec_contents: "source ../../cfg/power_spec.cpf"

vlsi:
  inputs:
    # Supply voltages.
    # TODO: add ability to tie pin to net in Hammer Innovus plugin
    supplies:
      power:  [ {name: "VDD",  pin: "VDD"}, {name: "VDDPST",  pin: "VDDPST"},{name: "POC",  pin: "POC"} ] 
      ground: [ {name: "VSS",  pin: "VSS"}, {name: "VSSPST",  pin: "VSSPST"} ]
      VDD: "1.8 V"
      GND: "0 V"
      VDDPST: "3.3 V"
      VSSPST: "0 V"
      POC: "3.3 V"

lvs.calibre.virtual_connect_colon: true

# Black-box the IO pad cells so their known-bad foundry internals don't
# fail the top-level LVS. Matches the LVS BOX line in signoff_lvs.
# `manual` mode makes hammer use our text (the default `auto` mode only
# picks up tech-provided text).
lvs.inputs.additional_lvs_text_mode: "manual"
lvs.inputs.additional_lvs_text: |
  LVS BOX PDDW1216CDG PVDD1CDG PVDD2CDG PVDD2POC

# BSG misc directory must be on the Conformal AND Genus `include search
# paths so that bsg_*.v can resolve their `include "bsg_defines.v" lines.
# Without this:
#  - Conformal LEC errors (couldn't load files at all)
#  - Genus prints ~30 VLOGPT-650 warnings per syn run; synthesis still
#    works because bsg_defines.v is also passed as a positional file to
#    read_hdl (so its macros land in the compilation unit), but the noisy
#    warnings clutter the log and would mask a real preprocessor issue.
formal.inputs.hdl_search_paths:
  - "${bsg_root}/bsg_misc"
formal.inputs.hdl_search_paths_meta: [subst]
synthesis.inputs.hdl_search_paths:
  - "${bsg_root}/bsg_misc"
synthesis.inputs.hdl_search_paths_meta: [subst]

# report_timing -max_paths cap.  Set effectively-unlimited so Tempus reports
# every unconstrained path (and setup/hold paths) without truncation.  The
# annotation `-path_exceptions all` added to the Hammer plugin's report_timing
# commands lets us distinguish Applied / Ignored / no-exception paths in the
# (potentially large) report rather than relying on a small cap for usability.
timing.inputs.max_paths: 1000000