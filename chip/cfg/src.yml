  "zeroscatter/design/tactile-ctrl-chip/v/cpu/serv_rf_top/serv_top.v",
  "zeroscatter/design/tactile-ctrl-chip/v/top/ctrl_top.v",
  "zeroscatter/design/tactile-ctrl-chip/v/top/bsg_link_wrapper.sv",
